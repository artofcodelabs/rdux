# Without this, the AllCops/Exclude below would *replace* RuboCop's default
# exclude list rather than extend it, letting RuboCop walk into vendor/bundle
# (where CI installs gems) and choke on a vendored gem's own .rubocop.yml.
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3.8
  Exclude:
    - test/dummy/db/schema.rb
    - test/dummy/db/secondary_schema.rb

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

Metrics/BlockLength:
  Exclude:
    - test/**/*_test.rb

Metrics/ClassLength:
  Exclude:
    - test/rdux_test.rb

Metrics/MethodLength:
  Exclude:
    - db/migrate/20230621215718_create_rdux_actions.rb
    - test/dummy/db/migrate/*.rdux.rb

Style/Documentation:
  Enabled: false
